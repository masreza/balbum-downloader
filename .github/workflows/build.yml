name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build (release)
        run: flutter build windows --release

      - name: Package
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          powershell Compress-Archive -Path . -DestinationPath ../../../../../balbum-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balbum-windows
          path: balbum-windows.zip

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build (release)
        run: flutter build linux --release

      - name: Package
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../balbum-linux-x64.tar.gz bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balbum-linux
          path: balbum-linux-x64.tar.gz

  release:
    name: Release (on tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
